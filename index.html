<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پاک‌کن جادویی املا</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#ffd25e;--ok:#4ade80;--bad:#fb7185;--wood:#a8692f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;overflow:hidden;font-family:'Vazirmatn',Tahoma,sans-serif;font-weight:700;color:#fff;background:#1b1340}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center;overflow:hidden}
.screen.on{display:flex}
#start{background:linear-gradient(120deg,#ff6ec4,#7873f5,#22d3ee,#4ade80,#fbbf24,#fb7185,#ff6ec4);background-size:500% 500%;animation:bg 14s ease infinite}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
#start>*:not(.fl){position:relative;z-index:2}
.fl{position:absolute;bottom:-80px;font-weight:900;opacity:.6;pointer-events:none;animation:up linear infinite}
@keyframes up{to{transform:translateY(-125vh) rotate(360deg)}}
.mascot{font-size:clamp(60px,16vw,96px);animation:wob 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 10px #0004)}
@keyframes wob{0%,100%{transform:rotate(-10deg) translateX(-10px)}50%{transform:rotate(12deg) translateX(14px)}}
h1{margin:4px 0 2px;font-weight:900;font-size:clamp(36px,11vw,68px);line-height:1.25;text-shadow:0 4px 0 #0003,0 0 22px #fff8}
.tw{display:inline-block;margin:0 6px;animation:bn 1.8s ease-in-out infinite}
@keyframes bn{50%{transform:translateY(-12px) scale(1.07)}}
.tag{font-size:clamp(16px,4.5vw,24px);margin:0 0 14px;text-shadow:0 2px 0 #0003}
.card{width:min(92vw,420px);background:#ffffff30;border:3px solid #ffffffa0;border-radius:30px;padding:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 14px 34px #0003}
.card label{display:block;font-size:clamp(18px,5vw,24px);margin-bottom:10px}
#nm{width:100%;font:inherit;font-size:clamp(20px,5.5vw,26px);text-align:center;padding:12px;border:3px solid transparent;border-radius:18px;background:#fff;color:#3b2a6b;outline:none;user-select:text;-webkit-user-select:text}
#nm.err{border-color:var(--bad);animation:sh .4s}
#hintn{min-height:26px;font-size:16px;color:#fff3b0;margin:6px 0 2px}
.btn{font:inherit;font-size:clamp(20px,5.5vw,28px);background:linear-gradient(180deg,#ffe27a,#ffb703);color:#5a3000;border:0;border-radius:40px;padding:12px 36px;cursor:pointer;box-shadow:0 6px 0 #c98400,0 10px 18px #0003}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c98400}
#go{animation:pl 1.8s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.06)}}
.btn2{font:inherit;font-size:clamp(16px,4.5vw,22px);background:#ffffff26;color:#fff;border:2px solid #fff;border-radius:30px;padding:10px 24px;cursor:pointer}
.credit{margin-top:14px;font-size:clamp(14px,4vw,20px);color:#fff;text-shadow:0 2px 0 #0004}
#game,#end{background:linear-gradient(160deg,#2b1a6b,#5b2a9a 55%,#0e7490)}
#game{justify-content:flex-start;padding:8px}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:clamp(14px,3.8vw,20px)}
.chip{background:#ffffff26;border-radius:20px;padding:4px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36vw}
.top button{font:inherit;background:var(--gold);color:#5a3000;border:0;border-radius:20px;padding:4px 12px;cursor:pointer}
.bar{width:100%;height:16px;background:#0005;border-radius:10px;margin:6px 0;overflow:hidden}
#fill{height:100%;width:100%;background:linear-gradient(90deg,#4ade80,#a3e635);border-radius:10px}
#msg{height:34px;font-size:clamp(17px,4.8vw,26px);color:var(--gold)}
#board{position:relative;flex:1;width:100%;min-height:0;touch-action:none;border:10px solid var(--wood);border-radius:20px;background:radial-gradient(circle at 50% 35%,#1f7a58,#124032);box-shadow:inset 0 0 40px #0008,0 8px 20px #0005}
.w{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:clamp(24px,7.2vw,44px);color:#3a2a10;padding:10px 4px;border-radius:18px;border:3px solid #fff;box-shadow:0 5px 0 #0003;white-space:nowrap;transition:opacity .4s,box-shadow .2s,background .2s}
.w.gone{opacity:0!important;pointer-events:none}
.w.ok{background:var(--ok)!important}
.w.no{background:var(--bad)!important;animation:sh .45s}
.w.reveal{background:#fff7c2!important;box-shadow:0 0 0 5px var(--gold),0 0 28px 10px #ffd25ecc;z-index:5;animation:pop .6s ease infinite alternate}
.w.reveal::after{content:'✓ پاسخ درست';position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:14px;background:var(--gold);color:#5a3000;border-radius:10px;padding:0 8px}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1.12)}}
@keyframes sh{25%{margin-left:-10px}75%{margin-left:10px}}
#end{justify-content:flex-start;overflow:auto;padding-top:16px}
#end h2{margin:0 0 8px;color:var(--gold);font-size:clamp(26px,7vw,40px)}
#cardimg{width:min(92vw,520px);height:auto;border-radius:14px;box-shadow:0 10px 30px #0006;-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0 6px}
#dlmsg{font-size:15px;min-height:22px;max-width:92vw}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="screen on" id="start">
  <div class="mascot">🧽</div>
  <h1 id="title"><span class="tw" style="color:#fff59d;animation-delay:0s">پاک‌کن</span><span class="tw" style="color:#ffffff;animation-delay:.25s">جادویی</span><span class="tw" style="color:#b9fbc0;animation-delay:.5s">املا</span></h1>
  <div class="tag">گوش کن، کلمه را پیدا کن و انتخابش کن! ✨</div>
  <div class="card">
    <label for="nm">✍️ نام دانش‌آموز</label>
    <input id="nm" type="text" maxlength="30" autocomplete="off">
    <div id="hintn"></div>
    <button class="btn" id="go">ورود به بازی 🚀</button>
  </div>
  <div class="credit">طراح: زهرا صفریان و زهرا بیکی</div>
</div>

<div class="screen" id="game">
  <div class="top"><span class="chip" id="who"></span><span class="chip" id="score">امتیاز: ۰</span><span class="chip" id="round"></span><button id="again">🔊 دوباره بشنو</button></div>
  <div class="bar"><div id="fill"></div></div>
  <div id="msg"></div>
  <div id="board"></div>
</div>

<div class="screen" id="end">
  <h2>🎉 کارنامهٔ شما آماده است</h2>
  <img id="cardimg" alt="کارنامه">
  <div class="acts">
    <button class="btn" id="dl">⬇️ دانلود کارنامه (عکس)</button>
    <button class="btn2" id="again2">🔁 بازی دوباره</button>
    <button class="btn2" id="nextg">👥 دانش‌آموز بعدی</button>
  </div>
  <div id="dlmsg">اگر دکمهٔ دانلود کار نکرد، انگشت را روی عکس نگه دارید و «ذخیره» را بزنید.</div>
  <div class="credit">طراح: زهرا صفریان و زهرا بیکی</div>
</div>

const TOTAL=WORDS.length,TIME=30000;
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const PAL=['#ffe08a','#a7f3d0','#fbcfe8','#bae6fd','#ddd6fe','#fed7aa','#fde68a','#c7f9cc','#f9a8d4','#bfdbfe','#fecaca'];
let leader='',order,idx,score,target,t0,raf,locked=true,els=[],res,voice=null,hasFa=false,ac=null,aud=null,keep=null,sx=0,sy=0,last=null,cardBlob=null;

(function(){const s=$('start'),L='آبادنمکسشیورتحخ★✦';for(let i=0;i<22;i++){const e=document.createElement('span');e.className='fl';e.textContent=L[Math.floor(Math.random()*L.length)];e.style.cssText='left:'+Math.random()*96+'%;font-size:'+(24+Math.random()*48)+'px;color:hsl('+Math.random()*360+' 90% 88%);animation-duration:'+(8+Math.random()*10)+'s;animation-delay:'+(-Math.random()*14)+'s';s.prepend(e)}})();

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function beep(f,d=.15,type='sine'){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function pickVoice(){try{const v=speechSynthesis.getVoices();const f=v.find(x=>/^fa/i.test(x.lang));hasFa=!!f;voice=f||v.find(x=>/^ar/i.test(x.lang))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function tts(text){try{pickVoice();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=voice?voice.lang:'fa-IR';if(voice)u.voice=voice;u.rate=.8;keep=u;setTimeout(()=>{try{speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){}},80)}catch(e){}}
function say(w){
  if(BUILTIN[w]){try{speechSynthesis.cancel()}catch(e){}try{aud=aud||new Audio();aud.pause();aud.src=BUILTIN[w];aud.play().catch(()=>tts(w))}catch(e){tts(w)}}
  else tts(w);
}
function unlock(){try{aud=aud||new Audio();aud.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';aud.play().catch(()=>{})}catch(e){}beep(520,.1)}

function enter(){
  const v=$('nm').value.trim();
  if(!v){$('nm').classList.add('err');$('hintn').textContent='اول نام دانش‌آموز را بنویس 🙂';beep(200,.2,'square');return}
  leader=v;unlock();start();
}
$('go').onclick=enter;
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
$('nm').addEventListener('input',()=>{$('nm').classList.remove('err');$('hintn').textContent=''});

function layout(){
  const b=$('board');b.innerHTML='';els=[];
  const cols=3,rows=Math.ceil(TOTAL/cols);
  const cells=shuffle([...Array(cols*rows).keys()]).slice(0,TOTAL);
  shuffle(WORDS).forEach((w,i)=>{
    const c=cells[i],cx=c%cols,cy=Math.floor(c/cols);
    const el=document.createElement('div');el.className='w';el.textContent=w;el.dataset.w=w;
    el.style.background=PAL[i%PAL.length];
    el.style.left=((cx+.5)/cols*100+(Math.random()-.5)*5)+'%';
    el.style.top=((cy+.5)/rows*100+(Math.random()-.5)*6)+'%';
    el.style.minWidth=(70/cols)+'%';el.prog=0;b.appendChild(el);els.push(el);
  });
}
function start(){order=shuffle(WORDS);idx=0;score=0;res=[];$('who').textContent='👥 '+leader;layout();show('game');next()}
function next(){
  if(idx>=TOTAL)return finish();
  locked=false;target=order[idx];
  $('round').textContent='کلمهٔ '+fa(idx+1)+' از '+fa(TOTAL);
  $('score').textContent='امتیاز: '+fa(score);
  $('msg').textContent='';$('fill').style.background='linear-gradient(90deg,#4ade80,#a3e635)';
  say(target);t0=performance.now();cancelAnimationFrame(raf);tick();
}
function tick(){
  const left=Math.max(0,TIME-(performance.now()-t0));
  $('fill').style.width=(left/TIME*100)+'%';
  if(left<8000)$('fill').style.background='linear-gradient(90deg,#fb7185,#f43f5e)';
  if(left<=0)return timeout();
  raf=requestAnimationFrame(tick);
}
const tEl=()=>els.find(e=>e.dataset.w===target);
const hide=el=>{el.style.opacity='';el.classList.add('gone')};
function record(status,chosen){res.push({word:target,status,chosen:chosen||'',sec:Math.min(TIME,performance.now()-t0)/1000})}
function advance(ms){idx++;setTimeout(next,ms)}
function timeout(){
  locked=true;record('timeout');beep(200,.3,'square');
  const t=tEl();t.classList.add('reveal');$('msg').textContent='وقت تمام شد! پاسخ درست این است 👇';
  setTimeout(()=>{t.classList.remove('reveal');hide(t)},1700);advance(1900);
}
function pick(el){
  if(locked||el.classList.contains('gone'))return;
  locked=true;cancelAnimationFrame(raf);const t=tEl();
  if(el===t){
    score++;record('correct',el.dataset.w);el.style.opacity='';el.classList.add('ok');
    beep(660,.12);setTimeout(()=>beep(880,.2),120);
    $('score').textContent='امتیاز: '+fa(score);$('msg').textContent='آفرین! درست بود ✨';
    setTimeout(()=>hide(el),600);advance(1300);
  }else{
    record('wrong',el.dataset.w);el.style.opacity='';el.classList.add('no');beep(180,.3,'square');
    t.classList.add('reveal');$('msg').textContent='این کلمه نبود. پاسخ درست این است 👇';
    setTimeout(()=>el.classList.remove('no'),900);
    setTimeout(()=>{t.classList.remove('reveal');hide(t)},1900);advance(2100);
  }
}

// tap or swipe a word to choose it
const board=$('board');
const hit=(x,y)=>els.find(e=>{if(e.classList.contains('gone'))return false;const r=e.getBoundingClientRect();return x>=r.left-6&&x<=r.right+6&&y>=r.top-6&&y<=r.bottom+6});
board.addEventListener('pointerdown',e=>{if(locked)return;sx=e.clientX;sy=e.clientY;last={x:sx,y:sy};try{board.setPointerCapture(e.pointerId)}catch(_){}});
board.addEventListener('pointermove',e=>{
  if(!last||locked)return;
  const d=Math.hypot(e.clientX-last.x,e.clientY-last.y);last={x:e.clientX,y:e.clientY};
  const el=hit(e.clientX,e.clientY);if(!el)return;
  const w=el.getBoundingClientRect().width;el.prog+=d;el.style.opacity=Math.max(.35,1-el.prog/(w*.9));
  if(el.prog>=w*.8)pick(el);
});
function release(e){
  const was=last;last=null;
  if(!locked&&was&&Math.hypot(e.clientX-sx,e.clientY-sy)<12){const el=hit(sx,sy);if(el)pick(el)}
  els.forEach(x=>{x.prog=0;if(!locked&&!x.classList.contains('gone'))x.style.opacity=''});
}
board.addEventListener('pointerup',release);
board.addEventListener('pointercancel',()=>{last=null});
$('again').onclick=()=>{if(!locked)say(target)};

// report card (image)
function rr(x,X,Y,w,h,r,fill){x.beginPath();if(x.roundRect)x.roundRect(X,Y,w,h,r);else x.rect(X,Y,w,h);x.fillStyle=fill;x.fill()}
function tx(x,t,X,Y,font,color,align,maxW){x.font=font;x.fillStyle=color;x.textAlign=align||'center';x.textBaseline='middle';if(maxW)x.fillText(t,X,Y,maxW);else x.fillText(t,X,Y)}
async function finish(){
  cancelAnimationFrame(raf);locked=true;show('end');
  try{await document.fonts.load('700 30px Vazirmatn')}catch(e){}
  const W=1080,rowH=84,tY=720,H=tY+(TOTAL+1)*rowH+190;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.direction='rtl';
  const F=s=>'700 '+s+'px Vazirmatn, Tahoma, sans-serif';
  let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#2b1a6b');g.addColorStop(.55,'#5b2a9a');g.addColorStop(1,'#0e7490');x.fillStyle=g;x.fillRect(0,0,W,H);
  rr(x,30,30,W-60,H-60,40,'#fffaf0');
  g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'#ff6ec4');g.addColorStop(.5,'#7873f5');g.addColorStop(1,'#22d3ee');rr(x,30,30,W-60,210,40,g);
  tx(x,'کارنامهٔ املا',W/2,115,F(70),'#fff');tx(x,'بازی پاک‌کن جادویی املا',W/2,195,F(36),'#fff6b0');
  const d=new Date(),ds=d.toLocaleDateString('fa-IR')+' - '+d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
  tx(x,'دانش‌آموز: '+leader,W-80,300,F(46),'#3b2a6b','right',620);
  tx(x,ds,80,300,F(30),'#666','left');
  const n={correct:0,wrong:0,timeout:0};res.forEach(r=>n[r.status]++);
  const pct=Math.round(score/TOTAL*100),avg=res.reduce((a,r)=>a+r.sec,0)/Math.max(1,res.length);
  const boxes=[['امتیاز',fa(score)+' از '+fa(TOTAL),'#16a34a'],['درصد',fa(pct)+'٪','#7c3aed'],['نادرست / بی‌پاسخ',fa(n.wrong)+' / '+fa(n.timeout),'#dc2626'],['میانگین زمان',fa(avg.toFixed(1)).replace('.','٫')+' ثانیه','#d97706']];
  const bw=(W-60-80-60)/4;
  boxes.forEach((b,i)=>{const X=W-70-bw-i*(bw+20);rr(x,X,350,bw,150,24,b[2]+'22');tx(x,b[0],X+bw/2,390,F(26),'#444',null,bw-16);tx(x,b[1],X+bw/2,452,F(36),b[2],null,bw-16)});
  const st=pct>=90?3:pct>=60?2:pct>0?1:0;
  tx(x,'★'.repeat(st)+'☆'.repeat(3-st),W/2,570,F(80),'#f5b301');
  tx(x,pct>=90?'عالی بود! آفرین به تو':pct>=60?'خیلی خوب! کمی دیگر تمرین کن':'تلاش خوبی بود، دوباره امتحان کن',W/2,646,F(40),'#3b2a6b',null,W-140);
  const cx=[970,790,560,340,150];
  rr(x,60,tY-10,W-120,rowH-4,20,'#7c3aed');
  ['ردیف','کلمه','نتیجه','انتخاب شما','زمان'].forEach((h,i)=>tx(x,h,cx[i],tY+rowH/2-12,F(30),'#fff'));
  res.forEach((r,i)=>{
    const y=tY+(i+1)*rowH;rr(x,60,y-10,W-120,rowH-6,18,i%2?'#ffffff':'#f3efe4');
    const m={correct:['✓ درست','#16a34a'],wrong:['✗ نادرست','#dc2626'],timeout:['زمان تمام شد','#d97706']}[r.status];
    const cy=y+rowH/2-13;
    tx(x,fa(i+1),cx[0],cy,F(30),'#555');tx(x,r.word,cx[1],cy,F(38),'#3b2a6b',null,200);
    tx(x,m[0],cx[2],cy,F(30),m[1],null,220);tx(x,r.chosen||'—',cx[3],cy,F(32),'#555',null,200);
    tx(x,fa(r.sec.toFixed(1)).replace('.','٫')+' ث',cx[4],cy,F(28),'#555',null,150);
  });
  tx(x,'زمان هر سؤال: '+fa(TIME/1000)+' ثانیه',W/2,H-125,F(28),'#666');
  tx(x,'طراح: زهرا صفریان و زهرا بیکی',W/2,H-75,F(36),'#7c3aed');
  $('cardimg').src=c.toDataURL('image/png');
  cardBlob=await new Promise(r=>c.toBlob(r,'image/png'));
}
$('dl').onclick=async()=>{
  if(!cardBlob)return;const name='کارنامه-'+leader.replace(/[\\\/:*?"<>|]/g,'')+'.png';
  try{if(window.claude&&claude.use){const dl=await claude.use('downloads');if(dl){await dl.save({filename:name,data:cardBlob});$('dlmsg').textContent='✓ کارنامه ذخیره شد';return}}}catch(e){if(e&&e.code==='declined')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(cardBlob);a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}
  $('dlmsg').textContent='اگر دانلود نشد، انگشت را روی عکس نگه دارید و «ذخیره» را بزنید.';
};
$('again2').onclick=()=>{unlock();start()};
$('nextg').onclick=()=>{$('nm').value='';show('start')};
</script>
